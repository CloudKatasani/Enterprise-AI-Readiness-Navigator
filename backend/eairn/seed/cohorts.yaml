# Anonymised peer-cohort distributions.
#
# Every consenting assessment enriches this network; the seed distributions below
# are synthetic reference cohorts used until a real cohort reaches n >= 15 (the
# P2 exit criterion). Cohorts are always published with their definition --
# industry, size band and platform mix -- because a percentile without a cohort
# definition is a misleading number.
